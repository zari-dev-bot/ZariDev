name: Galerie

on:
  push:
    paths:
      - "media/**"
      - ".github/galerie.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galerie
  cancel-in-progress: false

jobs:
  galerie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils (images et vidéos)
        run: |
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Préparer la galerie
        run: python .github/galerie.py
      - name: Enregistrer le résultat dans le dépôt
        run: |
          git config user.name "galerie-bot"
          git config user.email "galerie-bot@users.noreply.github.com"
          git add media
          git diff --cached --quiet && exit 0
          git commit -m "Galerie : miniatures et liste mises à jour"
          git pull --rebase
          git push
